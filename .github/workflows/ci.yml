name: Project checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data pipeline
        run: pip install -r requirements.txt
      - name: Run offline data integrity tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend
        run: npm install
      - name: Type and Svelte checks
        run: npm run check
      - name: Static site build
        run: npm run build
      - name: Statistical analysis unit tests
        run: npm run qa:research
