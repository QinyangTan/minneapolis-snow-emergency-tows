name: Record compact dashboard demo GIF

on:
  push:
    branches: [main]
    paths:
      - scripts/record-demos.mjs
      - .github/workflows/dashboard-demo-gif.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compact-dashboard-demo-gif
  cancel-in-progress: true

jobs:
  record-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install app and recorder dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Build verified Svelte site
        run: npm run build
      - name: Record real browser interactions
        run: DASHBOARD_ONLY=1 npm run demo:gifs
      - name: Validate new demo media
        run: |
          node --input-type=module -e "import {statSync} from 'node:fs'; const f='docs/demos/linked-dashboard-brushing.gif'; const n=statSync(f).size; if(n<30000||n>14*1024*1024)throw Error('Invalid GIF size '+n); console.log('Verified recorded Chromium GIF',n,'bytes');"
      - name: Upload reviewable recording
        uses: actions/upload-artifact@v4
        with:
          name: compact-dashboard-real-browser-gif
          path: docs/demos/linked-dashboard-brushing.gif
          if-no-files-found: error
          retention-days: 30
      - name: Commit GIF to private source repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demos/linked-dashboard-brushing.gif
          git diff --cached --quiet && exit 0
          git commit -m "docs: add authentic compact dashboard interaction GIF [skip ci]"
          git push origin HEAD:main
