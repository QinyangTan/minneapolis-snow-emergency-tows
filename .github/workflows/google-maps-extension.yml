name: Google Maps Extension — MV3 QA
on:
  pull_request:
    paths:
      - 'extension/**'
      - 'scripts/build-google-maps-extension.mjs'
      - 'scripts/test-google-maps-extension-browser.mjs'
      - 'scripts/test-google-maps-extension-live.mjs'
      - 'scripts/build-google-maps-demo-gif.py'
      - 'tests/test_google_maps_extension.mjs'
      - 'package.json'
      - '.github/workflows/google-maps-extension.yml'
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'scripts/build-google-maps-extension.mjs'
      - 'scripts/test-google-maps-extension-browser.mjs'
      - 'scripts/test-google-maps-extension-live.mjs'
      - 'scripts/build-google-maps-demo-gif.py'
      - 'tests/test_google_maps_extension.mjs'
      - 'package.json'
  workflow_dispatch:

# Same-repository demo branch only: commit an image generated from real-browser screenshots.
# All unrelated jobs remain read-only in effect; no outside PRs are allowed to commit.
permissions:
  contents: write

jobs:
  verify-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install existing project dependencies
        run: npm install --no-audit --no-fund
      - name: Test projection, aggregates, bundle and limited permissions
        run: npm run qa:extension
      - name: Confirm generated Chrome bundle exists
        run: |
          test -f build/google-maps-extension/manifest.json
          test -f build/google-maps-extension/content.js
          test -f build/google-maps-extension/data/neighborhoods.geojson
          node --check build/google-maps-extension/content.js
          node --check build/google-maps-extension/background.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test — Google Maps URL fixture and MV3
        run: npm run qa:extension:browser
      - name: Real Google Maps E2E — headed Chromium, no stubs or interception
        run: xvfb-run -a npm run qa:extension:live
        env:
          GMAPS_HEADED: '1'
        timeout-minutes: 5
      - name: Upload real Google Maps diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: google-maps-real-site-diagnostics
          path: artifacts/real-maps-diagnostic.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload real Google Maps snapshots for map-alignment review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: google-maps-overlay-real-browser-screenshots
          path: artifacts/live-map-overlay-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Create actual Google Maps interaction GIF for README
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/google-maps-extension-demo-gif' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python3 -m pip install --quiet Pillow==12.0.0
          python3 scripts/build-google-maps-demo-gif.py artifacts docs/demos/google-maps-extension-demo.gif
          file docs/demos/google-maps-extension-demo.gif
          test -s docs/demos/google-maps-extension-demo.gif
      - name: Commit browser-derived GIF to dedicated PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/google-maps-extension-demo-gif' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/demos/google-maps-extension-demo.gif
          if ! git diff --cached --quiet; then
            git commit -m 'docs: add real Google Maps extension demo GIF [skip ci]'
            git push origin HEAD:refs/heads/docs/google-maps-extension-demo-gif
          fi
      - name: Upload installable unpacked Chrome extension
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: google-maps-snow-emergency-extension
          path: build/google-maps-extension/
          if-no-files-found: error
          retention-days: 30
