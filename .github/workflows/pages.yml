name: Deploy site to GitHub Pages

# One-time setup by a repository admin: Settings → Pages → Build and deployment → Source: GitHub Actions.
# The github-pages environment deploys from main by default; add fp3-beta under
# Settings → Environments → github-pages → Deployment branches to deploy the beta branch directly.
on:
  push:
    branches: [main, fp3-beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGES_BASE_PATH: /minneapolis-snow-emergency-tows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Svelte checks
        run: npm run check
      - name: Data and story tests
        run: npm run qa:research
      - name: Build for the project subpath
        run: npm run build
      - name: Validate the static artifact
        run: npm run qa:pages
      - run: touch build/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
