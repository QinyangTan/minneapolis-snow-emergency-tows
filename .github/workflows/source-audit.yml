name: Official source data audit

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_data.py
      - .github/workflows/source-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Rebuild data from official Minneapolis services
        run: python scripts/build_data.py
      - name: Validate source counts before publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('static/data/quality.json').read_text())
          assert d['actual_total'] == 5423, 'Unexpected record total; investigate before publishing'
          assert len(d['events']) == 9, 'Unexpected event count'
          assert all(x['difference'] == 0 for x in d['events']), 'Source totals changed'
          assert d['unassigned_neighborhood_count'] <= d['actual_total'] * .20
          print('Source audit PASS:', d['actual_total'], 'total;', d['unassigned_neighborhood_count'], 'unassigned')
          PY
      - name: Publish verified aggregated data to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/data/summary.json static/data/neighborhoods.geojson static/data/quality.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish verified Minneapolis tow aggregates [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload aggregate data for quality review
        uses: actions/upload-artifact@v4
        with:
          name: city-neighborhood-data
          path: static/data/
          retention-days: 14
